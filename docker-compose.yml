services:
  db:
    image: mysql:8.0
    container_name: jastip_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: jastip_dev
      MYSQL_USER: jastip_user
      MYSQL_PASSWORD: jastip_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
